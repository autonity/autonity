name: Go
on:
  # workflow_dispatch adds a manual trigger button in the github UI that allows
  # you to trigger builds on specific branches when you are in the page for
  # this workflow.
  workflow_dispatch:
  # pull_request triggers this workflow on both internal and forked pull
  # requests.
  pull_request:
    types:
      - opened            # default
      - synchronize       # default
      - reopened          # default
      - ready_for_review  # added, makes it so that when a PR gets marked as rfr, contract tests execute

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  # We don't have access to the HOME environment variable here since we are not
  # inside a runner at this point, so we just have to hardcode '/home/runner',
  # if we instead defined these environment variables when we did have access
  # to HOME we would need to define them for each job, which would defeat the
  # purpose of defining them here.
  GO_CACHE: /home/runner/.cache/go-build # This is the location of the go build cache.
  GO_MODULES_CACHE: /home/runner/go/pkg # This is where module source code is stored.
  GO_VERSION: "1.24.0"
  TRUFFLE_TESTS: |
    [
      "autonity.js",
      "oracle.js",
      "liquid.js",
      "accountability.js",
      "protocol.js",
      "refund.js",
      "validator_management.js"
    ]

jobs:
  # generate test case IDs for docker tests.
  gen-docker-test-ids:
    runs-on: ubuntu-24.04
    outputs:
      ids_a: ${{ steps.set-ids.outputs.ids_a }}
      ids_b: ${{ steps.set-ids.outputs.ids_b }}
      ids_c: ${{ steps.set-ids.outputs.ids_c }}
    steps:
      - name: Generate test IDs
        id: set-ids
        run: |
          ALL_IDS=($(seq 0 3 26))
          LENGTH=${#ALL_IDS[@]}
          
          PART_SIZE=$(( (LENGTH + 2) / 3 ))
          
          PART_A=$(IFS=,; echo "${ALL_IDS[*]:0:$PART_SIZE}")
          echo "ids_a=[$PART_A]" >> $GITHUB_OUTPUT
          
          PART_B=$(IFS=,; echo "${ALL_IDS[*]:$PART_SIZE:$PART_SIZE}")
          echo "ids_b=[$PART_B]" >> $GITHUB_OUTPUT
          
          PART_C=$(IFS=,; echo "${ALL_IDS[*]:$((PART_SIZE * 2))}")
          echo "ids_c=[$PART_C]" >> $GITHUB_OUTPUT
          
          echo "Total IDs: $LENGTH"
          echo "Part A (${#PART_A[@]}): $PART_A"
          echo "Part B (${#PART_B[@]}): $PART_B"
          echo "Part C (${#PART_C[@]}): $PART_C"
  # prepare-cache fills the gocache with the source code for all modules and
  # attempts to fill the build cache with as much as possible intermediately
  # compiled source. Most other jobs depend on this job and so this serves to
  # speed up all other jobs. Since the cache only changes when the go modules
  # change, actually filling the cache happens quite infrequently. So most runs
  # should not be impacted by the time taken to fill the cache.
  prepare-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        id: gocache
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

        # We want to make sure that we download all the modules and compile
        # everything that may be needed so that they fill the go modules cache
        # and go-build dir.
      - name: Fill cache
        if: steps.gocache.outputs.cache-hit != 'true'
        run: |
          go mod download -x
          make autonity
          go build ./...
          go test -c ./eth

  # docker e2e test binary construction, shared by docker tests, thus we don't have
  # duplicated constructions in each test context.
  build-docker-test-artifacts:
    runs-on: ubuntu-24.04
    needs: [ prepare-cache ]
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build binaries
        run: make all
      - name: Set artifact name
        id: set-artifact-name
        run: echo "name=built-binaries-${{ github.run_id }}" >> $GITHUB_OUTPUT
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: ./build/bin/**
          retention-days: 1

  # upstream tests run the most upstream unit tests of different package.
  upstream-tests:
    needs: prepare-cache
    runs-on: ubuntu-latest
    env:
      # helps prevent '[failed to restore the stack]' messages when race detected.
      GORACE: "history_size=7"
    strategy:
      fail-fast: false
      matrix:
        # Here we set up a matrix to control our tests, we use go list and
        # negative grep to get most of the test packages for the main tests
        # excluding packages of particular interest. The excluded package are
        # those that are slow to test, our e2e tests and tendermint core.
        tests: [ [ major-tests, $(go list ./... | grep -E -v "/les|/p2p|/eth|/consensus/tendermint|/core$|/e2e_test") ],
                 [ p2p-eth-tests, $(go list ./p2p/... ./eth/... | grep -E -v "/p2p/simulations") -timeout 30m ],
                 [ core-p2p-simulation-tests, -p 1 ./p2p/simulations/... ./core ]
        ]

    name: ${{ matrix.tests[0] }}

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run tests
        run: go test ${{ matrix.tests[1] }}

  # prepare the main test cases of the e2e test framework.
  prepare-e2e-main-test-matrix:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - id: set-matrix
        name: fetch test lists
        run: |
          matrix=$(go test ./e2e_test -list=. | grep -v "ok" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  # concurrently run main test cases of e2e test framework.
  e2e-main-test:
    needs: prepare-e2e-main-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-e2e-main-test-matrix.outputs.matrix) }}
    name: ${{ matrix.tests }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - run: go test -v -run ${{ matrix.tests }} ./e2e_test -timeout 15m -race

  # prepare the byzantine test cases of the e2e test framework.
  prepare-byzantine-test-matrix:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - id: set-matrix
        name: fetch test lists
        run: |
          matrix=$(go test ./e2e_test/byzantine/...  -list=. | grep -v "ok" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  # concurrently run byzantine tests of the e2e test framework.
  byzantine-test:
    needs: prepare-byzantine-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-byzantine-test-matrix.outputs.matrix) }}
    name: ${{ matrix.tests }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - run: go test -v -run ${{ matrix.tests }} ./e2e_test/byzantine/... -timeout 15m -race

  # prepare protocol contract tests and break them into 2 batches.
  prepare-contracts-test-matrix:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix_batch1: ${{ steps.set-matrix.outputs.matrix_batch1 }}
      matrix_batch2: ${{ steps.set-matrix.outputs.matrix_batch2 }}
    steps:
      - uses: actions/checkout@v3
      - name: Find tests and split into two batches
        id: set-matrix
        run: |
          cd ./autonity/solidity/test

          temp_json_file=$(mktemp)

          for file in $(echo $TRUFFLE_TESTS | jq -r '.[]'); do
            grep 'describe(' "$file" | while IFS= read -r line; do
              describe_name=$(echo "$line" | sed -E "s/^[[:space:]]*describe\([\'\"](.+)[\'\"],.*/\1/")
              json_object=$(jq -n --arg file_name "$file" --arg describe_name "$describe_name" '{file_name: $file_name, describe_name: $describe_name}')
              echo "$json_object" >> "$temp_json_file"
            done
          done

          full_array=$(jq -s '.' "$temp_json_file")
          array_length=$(echo "$full_array" | jq 'length')

          split_index=$(( ($array_length + 1) / 2 ))

          batch1=$(echo "$full_array" | jq ".[0:$split_index]")
          batch2=$(echo "$full_array" | jq ".[$split_index:]")

          echo "matrix_batch1=$batch1" >> $GITHUB_OUTPUT
          echo "matrix_batch2=$batch2" >> $GITHUB_OUTPUT

          echo "Total tests found: $array_length"
          echo "Batch 1 size: $(echo "$batch1" | jq 'length')"
          echo "Batch 2 size: $(echo "$batch2" | jq 'length')"

  # run the contract tests batch1 via truffle framework.
  contracts-tests-batch1:
    needs: prepare-contracts-test-matrix
    runs-on: ubuntu-latest
    env:
      # helps prevent '[failed to restore the stack]' messages when race detected.
      GORACE: "history_size=7"
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-contracts-test-matrix.outputs.matrix_batch1) }}

    name: ${{ matrix.tests.file_name }} - ${{ matrix.tests.describe_name }}

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: make autonity
        run: make autonity
      - name: install js dependencies
        run: make test-contracts-pre
      - name: start autonity
        run: make start-autonity
      - name: test contract
        run: |
          echo 'Running npx truffle test --grep "${{ matrix.tests.describe_name }}" ${{ matrix.tests.file_name }}'
          cd ./autonity/solidity/test && npx truffle test --grep "${{ matrix.tests.describe_name }}" ${{ matrix.tests.file_name }}

  # run the contract tests batch2 via truffle framework.
  contracts-tests-batch2:
    needs: prepare-contracts-test-matrix
    runs-on: ubuntu-latest
    env:
      # helps prevent '[failed to restore the stack]' messages when race detected.
      GORACE: "history_size=7"
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-contracts-test-matrix.outputs.matrix_batch2) }}

    name: ${{ matrix.tests.file_name }} - ${{ matrix.tests.describe_name }}

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: make autonity
        run: make autonity
      - name: install js dependencies
        run: make test-contracts-pre
      - name: start autonity
        run: make start-autonity
      - name: test contract
        run: |
          echo 'Running npx truffle test --grep "${{ matrix.tests.describe_name }}" ${{ matrix.tests.file_name }}'
          cd ./autonity/solidity/test && npx truffle test --grep "${{ matrix.tests.describe_name }}" ${{ matrix.tests.file_name }}

  # tendermint-test-with-coverage runs the unit tests of the tendermint package with race condition detection and coverage report.
  tendermint-test-with-coverage:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run coverage
        run: |
          go test ./consensus/tendermint/... -timeout 20m -race -cover -covermode=atomic -test.coverprofile=coverage_tendermint_ut.out

      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.codecov_upload }}
          files: coverage_tendermint_ut.out
          yml: codecov.yml

  # lint does linting.
  lint:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3
        with:
          fetch-depth: '2'
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run linting
        run: make lint-ci
        shell: bash

  # Since using single job for docker test makes a few tests be pending there, thus we create multiple job to reduce
  # the waiting time in the CI.
  docker-e2e-test-a:
    needs: [build-docker-test-artifacts, gen-docker-test-ids]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case_id: ${{ fromJson(needs.gen-docker-test-ids.outputs.ids_a) }}
    steps:
      - uses: actions/checkout@v3
      - name: Ensure target directory exists
        run: mkdir -p ./build/bin
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-docker-test-artifacts.outputs.artifact-name }}
          path: ./build/bin/
      - name: Make binaries executable
        run: chmod +x ./build/bin/*

      - name: Run batch A tests
        run: |
          cd docker_e2e_test && \
          make docker-e2e-tests ID=${{ matrix.case_id }} HASH=${{ github.event.pull_request.head.sha }}

  docker-e2e-test-b:
    needs: [build-docker-test-artifacts, gen-docker-test-ids]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case_id: ${{ fromJson(needs.gen-docker-test-ids.outputs.ids_b) }}
    steps:
      - uses: actions/checkout@v3
      - name: Ensure target directory exists
        run: mkdir -p ./build/bin
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-docker-test-artifacts.outputs.artifact-name }}
          path: ./build/bin/
      - name: Make binaries executable
        run: chmod +x ./build/bin/*

      - name: Run batch B tests
        run: |
          cd docker_e2e_test && \
          make docker-e2e-tests ID=${{ matrix.case_id }} HASH=${{ github.event.pull_request.head.sha }}

  docker-e2e-test-c:
    needs: [build-docker-test-artifacts, gen-docker-test-ids]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case_id: ${{ fromJson(needs.gen-docker-test-ids.outputs.ids_c) }}
    steps:
      - uses: actions/checkout@v3
      - name: Ensure target directory exists
        run: mkdir -p ./build/bin
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-docker-test-artifacts.outputs.artifact-name }}
          path: ./build/bin/
      - name: Make binaries executable
        run: chmod +x ./build/bin/*

      - name: Run batch C tests
        run: |
          cd docker_e2e_test && \
          make docker-e2e-tests ID=${{ matrix.case_id }} HASH=${{ github.event.pull_request.head.sha }}