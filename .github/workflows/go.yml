name: Go
on:
  # workflow_dispatch adds a manual trigger button in the github UI that allows
  # you to trigger builds on specific branches when you are in the page for
  # this workflow.
  workflow_dispatch:
  # pull_request triggers this workflow on both internal and forked pull
  # requests.
  pull_request:
    types:
      - opened            # default
      - synchronize       # default
      - reopened          # default
      - ready_for_review  # added, makes it so that when a PR gets marked as rfr, contract tests execute

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  # We don't have access to the HOME environment variable here since we are not
  # inside a runner at this point, so we just have to hardcode '/home/runner',
  # if we instead defined these environment variables when we did have access
  # to HOME we would need to define them for each job, which would defeat the
  # purpose of defining them here.
  GO_CACHE: /home/runner/.cache/go-build # This is the location of the go build cache.
  GO_MODULES_CACHE: /home/runner/go/pkg # This is where module source code is stored.
  GO_VERSION: "1.24.0"
  RUN_ID: ${{ github.run_id }}
  TRUFFLE_TESTS: |
    [
      "autonity.js",
      "oracle.js",
      "liquid.js",
      "accountability.js",
      "protocol.js",
      "refund.js",
      "validator_management.js"
    ]

jobs:
  # generate test case IDs for docker tests.
  gen-docker-test-ids:
    runs-on: ubuntu-24.04
    outputs:
      ids_a: ${{ steps.set-ids.outputs.ids_a }}
      ids_b: ${{ steps.set-ids.outputs.ids_b }}
      ids_c: ${{ steps.set-ids.outputs.ids_c }}
    steps:
      - name: Generate test IDs
        id: set-ids
        run: |
          ALL_IDS=($(seq 0 3 26))
          LENGTH=${#ALL_IDS[@]}
          
          PART_SIZE=$(( (LENGTH + 2) / 3 ))
          
          PART_A=$(IFS=,; echo "${ALL_IDS[*]:0:$PART_SIZE}")
          echo "ids_a=[$PART_A]" >> $GITHUB_OUTPUT
          
          PART_B=$(IFS=,; echo "${ALL_IDS[*]:$PART_SIZE:$PART_SIZE}")
          echo "ids_b=[$PART_B]" >> $GITHUB_OUTPUT
          
          PART_C=$(IFS=,; echo "${ALL_IDS[*]:$((PART_SIZE * 2))}")
          echo "ids_c=[$PART_C]" >> $GITHUB_OUTPUT
          
          echo "Total IDs: $LENGTH"
          echo "Part A (${#PART_A[@]}): $PART_A"
          echo "Part B (${#PART_B[@]}): $PART_B"
          echo "Part C (${#PART_C[@]}): $PART_C"
  # prepare-cache fills the gocache with the source code for all modules and
  # attempts to fill the build cache with as much as possible intermediately
  # compiled source. Most other jobs depend on this job and so this serves to
  # speed up all other jobs. Since the cache only changes when the go modules
  # change, actually filling the cache happens quite infrequently. So most runs
  # should not be impacted by the time taken to fill the cache.
  prepare-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        id: gocache
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

        # We want to make sure that we download all the modules and compile
        # everything that may be needed so that they fill the go modules cache
        # and go-build dir.
      - name: Fill cache
        if: steps.gocache.outputs.cache-hit != 'true'
        run: |
          go mod download -x
          make autonity
          go build ./...
          go test -c ./eth

  # docker e2e test binary construction, shared by docker tests, thus we don't have
  # duplicated constructions in each test context.
  build-docker-test-artifacts:
    runs-on: ubuntu-24.04
    needs: [ prepare-cache ]
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build binaries
        run: make all
      - name: Set artifact name
        id: set-artifact-name
        run: echo "name=built-binaries-${{ github.run_id }}" >> $GITHUB_OUTPUT
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: ./build/bin/**
          retention-days: 1

  # tests runs most of the tests for the project, we use a matrix to run multiple configurations.
  main-tests:
    needs: prepare-cache
    runs-on: ubuntu-latest
    env:
      # helps prevent '[failed to restore the stack]' messages when race detected.
      GORACE: "history_size=7"
    strategy:
      fail-fast: false
      matrix:
        # Here we set up a matrix to control our tests, we use go list and
        # negative grep to get most of the test packages for the main tests
        # excluding packages of particular interest. The excluded package are
        # those that are slow to test, our e2e tests and tendermint core.
        tests: [ [ major-tests, $(go list ./... | grep -E -v "/les|/p2p|/eth|/consensus/tendermint|/core$|/e2e_test") ],
                 [ p2p-eth-tests, $(go list ./p2p/... ./eth/... | grep -E -v "/p2p/simulations") -timeout 30m ],
                 [ core-p2p-simulation-tests, -p 1 ./p2p/simulations/... ./core ],
                 [ tendermint-tests, ./consensus/tendermint/... -timeout 20m -race ]
        ]

    name: ${{ matrix.tests[0] }}

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run tests
        run: go test ${{ matrix.tests[1] }}

  # prepare the main test cases of the e2e test framework.
  prepare-e2e-main-test-matrix:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - id: set-matrix
        name: fetch test lists
        run: |
          matrix=$(go test ./e2e_test -list=. | grep -v "ok" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  # concurrently run main test cases of e2e test framework.
  e2e-main-test:
    needs: prepare-e2e-main-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-e2e-main-test-matrix.outputs.matrix) }}
    name: ${{ matrix.tests }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - run: go test -v -run ${{ matrix.tests }} ./e2e_test -timeout 15m -race

  # prepare the byzantine test cases of the e2e test framework.
  prepare-byzantine-test-matrix:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - id: set-matrix
        name: fetch test lists
        run: |
          matrix=$(go test ./e2e_test/byzantine/...  -list=. | grep -v "ok" | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  # concurrently run byzantine tests of the e2e test framework.
  byzantine-test:
    needs: prepare-byzantine-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-byzantine-test-matrix.outputs.matrix) }}
    name: ${{ matrix.tests }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - run: go test -v -run ${{ matrix.tests }} ./e2e_test/byzantine/... -timeout 15m -race

  # prepare protocol contract truffle test cases
  prepare-contracts-test-matrix:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - name: find tests
        id: set-matrix
        run:  |
          cd ./autonity/solidity/test
          # Temporary file to hold JSON objects
          temp_json_file=$(mktemp)
          for file in $(echo $TRUFFLE_TESTS | jq -r '.[]'); do
            grep 'describe(' "$file" | while IFS= read -r line; do
              describe_name=$(echo "$line" | sed -E "s/^[[:space:]]*describe\([\'\"](.+)[\'\"],.*/\1/")
              json_object=$(jq -n --arg file_name "$file" --arg describe_name "$describe_name" '{file_name: $file_name, describe_name: $describe_name}')
              echo "$json_object" >> "$temp_json_file"
              echo "$json_object"
            done
          done
          jq -s '.' "$temp_json_file" | jq -r tostring | while read -r json_array; do echo "matrix=$json_array" >> $GITHUB_OUTPUT; done
          cat $GITHUB_OUTPUT

  # tests runs most of the tests for the project, we use a matrix to run multiple configurations.
  contracts-tests:
    needs: prepare-contracts-test-matrix
    runs-on: ubuntu-latest
    env:
      # helps prevent '[failed to restore the stack]' messages when race detected.
      GORACE: "history_size=7"
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJSON(needs.prepare-contracts-test-matrix.outputs.matrix) }}

    name: ${{ matrix.tests.file_name }} - ${{ matrix.tests.describe_name }}

    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: make autonity
        run: make autonity
      - name: install js dependencies
        run: make test-contracts-pre
      - name: start autonity
        run: make start-autonity
      - name: test contract
        run: |
          echo 'Running npx truffle test --grep "${{ matrix.tests.describe_name }}" ${{ matrix.tests.file_name }}'
          cd ./autonity/solidity/test && npx truffle test --grep "${{ matrix.tests.describe_name }}" ${{ matrix.tests.file_name }}

  tendermint-ut-coverage:
    needs: prepare-cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - name: Run unit test coverage
        run: |
          go test ./consensus/tendermint/... -timeout 15m -cover -covermode=atomic -test.coverprofile="coverage_ut_${{ env.RUN_ID }}.out"
      - name: Upload unit test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ut-artifact-${{ env.RUN_ID }}
          path: coverage_ut_${{ env.RUN_ID }}.out
          retention-days: 1

  discover-integration-tests:
    needs: prepare-cache
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - id: set-matrix
        name: Discover integration tests
        run: |
          if [ ! -d "./e2e_test" ]; then
            echo "::warning::./e2e_test directory not found"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          tests=$(cd ./e2e_test && go test -list=. . 2>/dev/null | grep -v "ok" | grep -v "^?" | jq -R -s -c 'split("\n") | map(select(. != ""))')
          if [ -z "$tests" ]; then
            echo "::warning::No tests found in ./e2e_test"
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            echo "matrix=$tests" >> $GITHUB_OUTPUT
          fi

  integration-test-coverage:
    needs: discover-integration-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testName: ${{ fromJSON(needs.discover-integration-tests.outputs.matrix) }}
    if: ${{ fromJSON(needs.discover-integration-tests.outputs.matrix) != '[]' }}
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v3
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}
      - name: Run specific integration test with coverage
        run: |
          go test -v -run "^${{ matrix.testName }}$" ./e2e_test \
            -cover -covermode=atomic \
            -coverpkg=./consensus/tendermint/... \
            -test.coverprofile="coverage_${{ env.RUN_ID }}_${{ matrix.testName }}.out"
      - name: Upload partial coverage report
        uses: actions/upload-artifact@v4
        with:
          name: partial-coverage-${{ env.RUN_ID }}-${{ matrix.testName }}
          path: coverage_${{ env.RUN_ID }}_${{ matrix.testName }}.out
          retention-days: 1

merge-coverage-reports:
  needs:
    - integration-test-coverage
    - tendermint-ut-coverage
  runs-on: ubuntu-latest
  if: ${{ fromJSON(needs.discover-integration-tests.outputs.matrix) != '[]' }}
  steps:
    - name: Download unit test coverage artifact
      uses: actions/download-artifact@v4
      with:
        name: coverage-ut-artifact-${{ env.RUN_ID }}
        path: unit-coverage-dir

    - name: Download all integration coverage artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: partial-coverage-${{ env.RUN_ID }}-*
        path: integration-coverage-dir
        # merge the downloaded files into the same directory.
        merge-multiple: true

    - name: Merge coverage reports
      run: |
        go install github.com/wadey/gocovmerge@latest
        GO_BIN_PATH=$(go env GOPATH)/bin
        
        # 调试：检查下载的文件结构
        echo "=== 检查integration-coverage-dir目录结构 ==="
        find integration-coverage-dir -name "*.out" -type f | while read file; do
          echo "找到文件: $file"
        done
        
        echo "=== 检查unit-coverage-dir目录结构 ==="
        find unit-coverage-dir -name "*.out" -type f | while read file; do
          echo "找到文件: $file"
        done
        
        if find integration-coverage-dir -name "*.out" -type f | grep -q .; then
          echo "start to merge sub coverage reports..."
          INTEGRATION_FILES=$(find integration-coverage-dir -name "*.out" -type f | tr '\n' ' ')
          echo "list of reports: $INTEGRATION_FILES"
        
          if [ -n "$INTEGRATION_FILES" ]; then
            $GO_BIN_PATH/gocovmerge $INTEGRATION_FILES > coverage_integration_merged_${{ env.RUN_ID }}.out
            echo "sub reports were merged"
          else
            echo "error: can not find any covery report"
            echo "mode: atomic" > coverage_integration_merged_${{ env.RUN_ID }}.out
          fi
        else
          echo "eror: cannot find any covery report"
          echo "mode: atomic" > coverage_integration_merged_${{ env.RUN_ID }}.out
        fi
        
        if [ -f "unit-coverage-dir/coverage_ut_${{ env.RUN_ID }}.out" ]; then
          echo "start to merge UT coverage report with the Integration Test coverage report"
          $GO_BIN_PATH/gocovmerge unit-coverage-dir/coverage_ut_${{ env.RUN_ID }}.out coverage_integration_merged_${{ env.RUN_ID }}.out > coverage_final_${{ env.RUN_ID }}.out
          echo "final covery report: coverage_final_${{ env.RUN_ID }}.out"
        else
          echo "error: cannot find UT coverage report"
          echo "unit-coverage-dir content:"
          ls -la unit-coverage-dir/ || true
          exit 1
        fi

    - name: Upload to Codecov
      uses: codecov/codecov-action@v1
      with:
        token: ${{ secrets.codecov_upload }}
        files: coverage_final_${{ env.RUN_ID }}.out
        yml: codecov.yml
        flags: run_${{ env.RUN_ID }}

  # tendermint-coverage runs the tendermint tests and collects the coverage, it
  # can't be part of the matrix tests since we need to use the codecov action,
  # which we do not want to use for the rest of the codebase.
  # to speed up the tendermint coverage test, we remove those counting triggered by e2e tests, the target
  # drop to 60% as the unit test of tendermint package has 61.33% for the time being.
  tendermint-tests-coverage_legacy:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run coverage
        run: |
          go test ./consensus/tendermint/... -timeout 15m -cover -covermode=atomic -test.coverprofile=coverage_tendermint_ut.out

      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.codecov_upload }}
          files: coverage_tendermint_ut.out
          yml: codecov.yml

  # lint does linting.
  lint:
    needs: prepare-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v3
        with:
          fetch-depth: '2'
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GO_CACHE }}
            ${{ env.GO_MODULES_CACHE }}
          key: ${{ runner.os }}-gocache-${{ env.GO_VERSION }}${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run linting
        run: make lint-ci
        shell: bash

  # Since using single job for docker test makes a few tests be pending there, thus we create multiple job to reduce
  # the waiting time in the CI.
  docker-e2e-test-a:
    needs: [build-docker-test-artifacts, gen-docker-test-ids]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
       case_id: ${{ fromJson(needs.gen-docker-test-ids.outputs.ids_a) }}
    steps:
      - uses: actions/checkout@v3
      - name: Ensure target directory exists
        run: mkdir -p ./build/bin
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-docker-test-artifacts.outputs.artifact-name }}
          path: ./build/bin/
      - name: Make binaries executable
        run: chmod +x ./build/bin/*

      - name: Run batch A tests
        run: |
          cd docker_e2e_test && \
          make docker-e2e-tests ID=${{ matrix.case_id }} HASH=${{ github.event.pull_request.head.sha }}

  docker-e2e-test-b:
    needs: [build-docker-test-artifacts, gen-docker-test-ids]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case_id: ${{ fromJson(needs.gen-docker-test-ids.outputs.ids_b) }}
    steps:
      - uses: actions/checkout@v3
      - name: Ensure target directory exists
        run: mkdir -p ./build/bin
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-docker-test-artifacts.outputs.artifact-name }}
          path: ./build/bin/
      - name: Make binaries executable
        run: chmod +x ./build/bin/*

      - name: Run batch B tests
        run: |
          cd docker_e2e_test && \
          make docker-e2e-tests ID=${{ matrix.case_id }} HASH=${{ github.event.pull_request.head.sha }}

  docker-e2e-test-c:
    needs: [build-docker-test-artifacts, gen-docker-test-ids]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case_id: ${{ fromJson(needs.gen-docker-test-ids.outputs.ids_c) }}
    steps:
      - uses: actions/checkout@v3
      - name: Ensure target directory exists
        run: mkdir -p ./build/bin
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-docker-test-artifacts.outputs.artifact-name }}
          path: ./build/bin/
      - name: Make binaries executable
        run: chmod +x ./build/bin/*

      - name: Run batch C tests
        run: |
          cd docker_e2e_test && \
          make docker-e2e-tests ID=${{ matrix.case_id }} HASH=${{ github.event.pull_request.head.sha }}